<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Flores</title>
  <style>
    :root{
      --yellow:#ffe600;
      --yellow2:#fff36a;
      --black:#000;
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;height:100%;margin:0;overflow:hidden;
      background:#000;color:var(--yellow);
      font-family:Arial,Helvetica,sans-serif;
      touch-action:none;
      -webkit-user-select:none;user-select:none;
    }
    #app{position:fixed;inset:0;background:#000;overflow:hidden}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    #app::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,230,0,.85);opacity:0;pointer-events:none;z-index:2}
    #app.explode::after{animation:shock .65s cubic-bezier(.1,.7,.2,1)}
    @keyframes shock{0%{opacity:.95;box-shadow:0 0 0 0 rgba(255,230,0,.7)}55%{opacity:.25;box-shadow:0 0 0 35vw rgba(255,230,0,0)}100%{opacity:0;box-shadow:0 0 0 45vw rgba(255,230,0,0)}}
    #intro{
      position:absolute;inset:0;display:grid;place-items:center;
      transition:opacity .45s ease;
      pointer-events:none;
    }
    #start{
      pointer-events:auto;
      width:118px;height:118px;border-radius:50%;border:0;
      background:var(--yellow);box-shadow:0 0 0 0 rgba(255,230,0,.35);
      cursor:pointer;outline:none;
      animation:pulse 2s infinite;
    }
    #start:active{transform:scale(.93)}
    #message{
      position:absolute;inset:0;display:grid;place-items:center;
      padding:8vw;text-align:center;pointer-events:none;
      opacity:0;transform:scale(.96);
      transition:opacity .9s ease,transform .9s ease;
    }
    #message.show{opacity:1;transform:scale(1)}
    #message h1{
      margin:0;max-width:1100px;
      font-size:clamp(42px,9vw,150px);
      line-height:.95;letter-spacing:-.045em;
      color:var(--yellow);font-weight:800;
      text-shadow:0 0 24px rgba(255,230,0,.10);
    }
    #hint{
      position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
      color:rgba(255,230,0,.35);font-size:12px;letter-spacing:.14em;
      text-transform:uppercase;opacity:0;transition:opacity .8s;
      pointer-events:none;white-space:nowrap;
    }
    #hint.show{opacity:1}
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(255,230,0,.28)}
      50%{box-shadow:0 0 0 18px rgba(255,230,0,0)}
    }
  </style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="intro">
    <button id="start" aria-label="Comenzar"></button>
  </div>

  <div id="message">
    <!-- CAMBIA ESTE TEXTO -->
    <h1 id="messageText">FELIZ DIA DE LAS FLORES AMARILLAS AMOR DE MI VIDA <3</h1>
  </div>

  <div id="hint">Toque · Arrastre · Disfrute mi amor</div>
</div>

<script>
(() => {
  "use strict";

  // ============================================================
  // CONFIGURACIÓN RÁPIDA
  // ============================================================
  const TEXT = "FELIZ DIA DE LAS FLORES AMARILLAS AMOR DE MI VIDA <3"; // <-- cambia esto
  const FLOWER_COUNT = 175;     // flores del estallido inicial
  const TRAIL_GAP = 18;         // distancia entre flores al arrastrar
  const MAX_INTERACTIVE = 700;  // límite para no saturar móviles
  const FLOWER_LIFE = 2600;     // ms de vida de una flor tocada/dibujada

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha:false });
  const start = document.getElementById("start");
  const intro = document.getElementById("intro");
  const message = document.getElementById("message");
  const messageText = document.getElementById("messageText");
  const hint = document.getElementById("hint");

  messageText.textContent = TEXT;

  let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
  let flowers=[];
  let running=false;
  let pointerDown=false;
  let lastX=0,lastY=0,lastStamp=0;

  function resize(){
    W=innerWidth; H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener("resize",resize,{passive:true});
  resize();

  // ------------------------------------------------------------
  // Flor vectorial: 8 pétalos, contorno oscuro y centro amarillo,
  // inspirada directamente en la referencia subida.
  // ------------------------------------------------------------
  function drawFlower(x,y,size,rot,alpha=1){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha=alpha;
    const petals=8, outline=Math.max(1.25,size*.052);
    for(let i=0;i<petals;i++){
      ctx.save(); ctx.rotate(i*Math.PI*2/petals);
      const grad=ctx.createLinearGradient(0,-size*.05,0,-size);
      grad.addColorStop(0,"#ffd83d"); grad.addColorStop(.42,"#ffe65a"); grad.addColorStop(1,"#f4c928");
      ctx.beginPath();
      ctx.moveTo(0,-size*.13);
      ctx.bezierCurveTo(-size*.28,-size*.22,-size*.67,-size*.46,-size*.62,-size*.76);
      ctx.bezierCurveTo(-size*.57,-size*.97,-size*.23,-size*1.08,0,-size);
      ctx.bezierCurveTo(size*.23,-size*1.08,size*.57,-size*.97,size*.62,-size*.76);
      ctx.bezierCurveTo(size*.67,-size*.46,size*.28,-size*.22,0,-size*.13);
      ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
      ctx.lineWidth=outline; ctx.strokeStyle="#17130a"; ctx.stroke();

      ctx.beginPath(); ctx.moveTo(0,-size*.19);
      ctx.quadraticCurveTo(-size*.035,-size*.50,0,-size*.86);
      ctx.strokeStyle="rgba(190,145,15,.42)"; ctx.lineWidth=Math.max(.8,size*.018); ctx.stroke();

      for(const yy of [.38,.53,.68]){
        ctx.beginPath(); ctx.moveTo(-size*.01,-size*yy);
        ctx.quadraticCurveTo(-size*.13,-size*(yy+.07),-size*.22,-size*(yy+.10));
        ctx.strokeStyle="rgba(202,155,17,.30)"; ctx.lineWidth=Math.max(.55,size*.012); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(size*.01,-size*yy);
        ctx.quadraticCurveTo(size*.13,-size*(yy+.07),size*.22,-size*(yy+.10)); ctx.stroke();
      }

      ctx.beginPath(); ctx.ellipse(-size*.19,-size*.70,size*.10,size*.22,-.35,0,Math.PI*2);
      ctx.fillStyle="rgba(255,252,185,.62)"; ctx.fill();
      ctx.restore();
    }

    ctx.beginPath(); ctx.arc(0,0,size*.345,0,Math.PI*2);
    const center=ctx.createRadialGradient(-size*.10,-size*.12,size*.03,0,0,size*.36);
    center.addColorStop(0,"#fff9a5"); center.addColorStop(.5,"#ffe95a"); center.addColorStop(1,"#f3cf28");
    ctx.fillStyle=center; ctx.fill(); ctx.lineWidth=outline*1.15; ctx.strokeStyle="#17130a"; ctx.stroke();

    for(let i=0;i<18;i++){
      const ang=i*2.399, r=size*(.08+(i%5)*.045);
      ctx.beginPath(); ctx.arc(Math.cos(ang)*r,Math.sin(ang)*r,size*.018,0,Math.PI*2);
      ctx.fillStyle="rgba(185,137,12,.38)"; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(-size*.10,-size*.11,size*.105,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,225,.55)"; ctx.fill();
    ctx.restore();
  }

  function addFlower(x,y,size,rot,extra={}){
    if(flowers.length>=MAX_INTERACTIVE){
      flowers.splice(0,Math.ceil(MAX_INTERACTIVE*.08));
    }
    flowers.push({
      x,y,size,rot,
      alpha:extra.alpha ?? 1,
      born:performance.now(),
      life:extra.life ?? Infinity,
      vx:extra.vx ?? 0,
      vy:extra.vy ?? 0,
      spin:extra.spin ?? 0,
      scaleIn:extra.scaleIn ?? 1,
      mode:extra.mode ?? "interactive",
      angle:extra.angle ?? 0,
      targetR:extra.targetR ?? 0,
      delay:extra.delay ?? 0
    });
  }

  function burst(){
    flowers.length=0;
    const cx=W/2,cy=H/2,maxR=Math.hypot(W,H)*.82;

    for(let i=0;i<FLOWER_COUNT;i++){
      const angle=Math.random()*Math.PI*2, targetR=Math.pow(Math.random(),.58)*maxR;
      addFlower(cx,cy,15+Math.random()*29,Math.random()*Math.PI*2,{
        alpha:0,life:2700+Math.random()*1100,spin:(Math.random()-.5)*3.2,
        scaleIn:.04,mode:"burst",angle,targetR,delay:Math.random()*650
      });
    }
    for(let i=0;i<Math.floor(FLOWER_COUNT*.55);i++){
      const angle=Math.random()*Math.PI*2, targetR=Math.pow(Math.random(),.48)*maxR*1.08;
      addFlower(cx,cy,9+Math.random()*16,Math.random()*Math.PI*2,{
        alpha:0,life:2400+Math.random()*1200,spin:(Math.random()-.5)*4,
        scaleIn:.02,mode:"burst",angle,targetR,delay:250+Math.random()*850
      });
    }
  }

  function startExperience(){
    if(running)return;
    running=true;
    const app=document.getElementById("app");
    app.classList.remove("explode"); void app.offsetWidth; app.classList.add("explode");
    start.style.pointerEvents="none";
    intro.style.opacity="0";
    burst();

    // después del estallido: negro + texto
    setTimeout(()=>{
      flowers.length=0;
      message.classList.add("show");
      hint.classList.add("show");
    },3900);
  }

  start.addEventListener("click",startExperience);

  // ------------------------------------------------------------
  // Interacción táctil / mouse.
  // Cada toque crea una flor. Al arrastrar, se siembra un trazo.
  // ------------------------------------------------------------
  function pointFromEvent(e){
    return {x:e.clientX,y:e.clientY};
  }

  function plant(x,y,force=false){
    const now=performance.now();
    if(!force && now-lastStamp<25)return;
    lastStamp=now;
    addFlower(
      x,y,
      13+Math.random()*18,
      Math.random()*Math.PI*2,
      {
        life:FLOWER_LIFE+Math.random()*1200,
        scaleIn:.15,
        spin:(Math.random()-.5)*.8
      }
    );
  }

  canvas.addEventListener("pointerdown",e=>{
    if(!running)return;
    pointerDown=true;
    canvas.setPointerCapture?.(e.pointerId);
    const p=pointFromEvent(e);
    lastX=p.x; lastY=p.y;
    plant(p.x,p.y,true);
  });

  canvas.addEventListener("pointermove",e=>{
    if(!running || !pointerDown)return;
    const p=pointFromEvent(e);
    const dx=p.x-lastX,dy=p.y-lastY;
    const dist=Math.hypot(dx,dy);
    if(dist>=TRAIL_GAP){
      const steps=Math.ceil(dist/TRAIL_GAP);
      for(let i=1;i<=steps;i++){
        const t=i/steps;
        plant(lastX+dx*t,lastY+dy*t,true);
      }
      lastX=p.x;lastY=p.y;
    }
  });

  canvas.addEventListener("pointerup",()=>{
    pointerDown=false;
  });
  canvas.addEventListener("pointercancel",()=>{
    pointerDown=false;
  });

  function animate(now){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    for(let i=flowers.length-1;i>=0;i--){
      const f=flowers[i];
      const age=now-f.born;

      if(age>f.life){
        flowers.splice(i,1);
        continue;
      }

      if(f.mode==="burst"){
        const active=Math.max(0,age-f.delay), t=Math.min(active/2050,1);
        const ease=1-Math.pow(1-t,3), cx=W/2, cy=H/2;
        f.x=cx+Math.cos(f.angle)*f.targetR*ease;
        f.y=cy+Math.sin(f.angle)*f.targetR*ease;
        f.alpha=active<=0 ? 0 : Math.min(1,active/130);
        f.scaleIn=active<=0 ? .02 : Math.min(1,.10+ease*.90);
        f.rot+=f.spin*.012;
      }else{
        const k=Math.min(1,age/220);
        f.scaleIn=Math.min(1,.08+.92*k);
        f.rot+=f.spin*.004;
        f.alpha=age>f.life-450 ? Math.max(0,(f.life-age)/450) : 1;
      }

      drawFlower(f.x,f.y,f.size*f.scaleIn,f.rot,f.alpha);
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
